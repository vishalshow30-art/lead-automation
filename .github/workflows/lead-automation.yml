    )

    ensure_leads_file()

    existing_leads = load_existing_leads()

    print(
        f"Existing leads: "
        f"{len(existing_leads)}"
    )

    new_leads = collect_all_leads(
        existing_leads
    )

    if new_leads:

        existing_leads.extend(
            new_leads
        )

        save_leads(
            existing_leads
        )

        print(
            f"Added {len(new_leads)} new leads."
        )

    else:

        print(
            "No new leads collected "
            "in this cycle."
        )

    print(
        f"Total leads in CSV: "
        f"{len(existing_leads)}"
    )

    print("=" * 60)
    print("LEAD AUTOMATION COMPLETED")
    print("=" * 60)


if __name__ == "__main__":
    main()
