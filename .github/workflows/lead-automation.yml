name: Lead Automation

on:
  workflow_dispatch:

  schedule:
    # Every 5 hours
    - cron: "0 */5 * * *"

jobs:
  lead-automation:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 3. Install Dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ==========================================
      # 4. Check Required Secrets
      # ==========================================
      - name: Check Secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          echo "Checking required GitHub Secrets..."

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "ERROR: GOOGLE_SHEET_ID is missing."
            exit 1
          fi

          echo "YOUTUBE_API_KEY: available"
          echo "GOOGLE_SERVICE_ACCOUNT_JSON: available"
          echo "GOOGLE_SHEET_ID: available"
          echo "All required secrets are available."

      # ==========================================
      # 5. Run Lead Collector
      # ==========================================
      - name: Run Lead Collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          echo "=========================================="
          echo "STARTING LEAD COLLECTOR"
          echo "=========================================="

          python src/lead_collector.py

          echo "=========================================="
          echo "LEAD COLLECTOR FINISHED"
          echo "=========================================="

      # ==========================================
      # 6. Check CSV
      # ==========================================
      - name: Check leads.csv
        run: |
          echo "Checking leads.csv..."

          if [ -f data/leads.csv ]; then
            echo "leads.csv created successfully."

            echo "Number of lines:"
            wc -l data/leads.csv

            echo ""
            echo "CSV preview:"
            head -10 data/leads.csv

          else
            echo "ERROR: data/leads.csv was not created."
            exit 1
          fi

      # ==========================================
      # 7. Upload CSV as GitHub Artifact
      # ==========================================
      - name: Upload leads CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-leads
          path: data/leads.csv
          if-no-files-found: error
          compression-level: 6
          overwrite: true

      # ==========================================
      # 8. Final Status
      # ==========================================
      - name: Final Status
        run: |
          echo ""
          echo "=========================================="
          echo "LEAD AUTOMATION COMPLETED"
          echo "=========================================="
          echo ""
          echo "CSV file: OK"
          echo "Google Sheets upload was handled by"
          echo "src/lead_collector.py"
          echo ""
          echo "Check the 'Run Lead Collector' step"
          echo "for Google Sheets upload verification."
          echo "=========================================="
