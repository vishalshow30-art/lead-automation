def collect_instagram() -> List[Dict[str, Any]]:

    if not INSTAGRAM_ACCESS_TOKEN:
        print(
            "Instagram: API token not configured. "
            "Skipping."
        )
        return []

    print(
        "Instagram: authorized API detected."
    )

    try:
        response = requests.get(
            "https://graph.instagram.com/me",
            params={
                "fields": (
                    "id,username,name,"
                    "account_type,media_count"
                ),
                "access_token":
                    INSTAGRAM_ACCESS_TOKEN,
            },
            timeout=REQUEST_TIMEOUT
        )

        response.raise_for_status()

        data = response.json()

        username = clean(
            data.get("username", "")
        )

        name = clean(
            data.get("name", "")
        ) or username

        if not username:
            return []

        profile = (
            f"https://www.instagram.com/"
            f"{username}/"
        )

        return [
            {
                "name": name,
                "platform": "Instagram",
                "profile_url": profile,
                "channel_url": "",
                "creator_or_business":
                    "Creator/Business",
                "niche": "",
                "country": "",
                "city": "",
                "subscribers": "",
                "avg_views": "",
                "business_email": "",
                "instagram": profile,
                "linkedin": "",
                "twitter_x": "",
                "website": "",
                "recent_upload": "",
                "contact_type":
                    "Public profile",
                "lead_source":
                    "Instagram Graph API",
                "status": "New",
                "notes":
                    "Authorized account data.",
            }
        ]

    except requests.RequestException as error:
        print(
            f"Instagram API error: {error}"
        )
        return []


