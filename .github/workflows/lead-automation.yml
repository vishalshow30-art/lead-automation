# ============================================================
# MAIN COLLECTION
# ============================================================

def collect_youtube_leads(
    existing_leads: List[Dict[str, str]],
) -> List[Dict[str, str]]:

    youtube = get_youtube_service()

    if youtube is None:
        return []

    discovered = []

    print("Starting YouTube discovery...")

    for search_term in SEARCH_TERMS:

        print(
            f"Searching YouTube: {search_term}"
        )

        channels = search_youtube_channels(
            youtube,
            search_term,
            max_results=25,
        )

        channel_ids = [
            channel["channel_id"]
            for channel in channels
            if channel.get("channel_id")
        ]

        channel_details = (
            get_youtube_channel_details(
                youtube,
                channel_ids,
            )
        )

        for lead in channel_details:

            if not is_relevant_lead(lead):
                continue

            if lead_exists(
                existing_leads,
                lead["channel_url"],
                lead["name"],
            ):
                continue

            if any(
                existing.get(
                    "channel_url",
                    "",
                ).lower()
                == lead["channel_url"].lower()
                for existing in discovered
            ):
                continue

            discovered.append(lead)

        # Avoid unnecessarily fast API requests.
        time.sleep(1)

    print(
        f"New YouTube leads found: "
        f"{len(discovered)}"
    )

    return discovered


def collect_all_leads(
    existing_leads: List[Dict[str, str]],
) -> List[Dict[str, str]]:

    all_new_leads = []

    # YouTube
    youtube_leads = collect_youtube_leads(
        existing_leads
    )
    all_new_leads.extend(
        youtube_leads
    )

    # Instagram
    all_new_leads.extend(
        collect_instagram_leads()
    )

    # Facebook
    all_new_leads.extend(
        collect_facebook_leads()
    )

    # X/Twitter
    all_new_leads.extend(
        collect_x_leads()
    )

    # LinkedIn
    all_new_leads.extend(
        collect_linkedin_leads()
    )

    # Websites
    all_new_leads.extend(
        collect_website_leads()
    )

    return all_new_leads


