name: Lead Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  lead-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Secrets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "ERROR: GOOGLE_SHEET_ID is missing."
            exit 1
          fi

          echo "YouTube API key is available."
          echo "Google service account secret is available."
          echo "Google Sheet ID is available."

      - name: Run Lead Collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python src/lead_collector.py

      - name: Show Current Leads
        run: |
          echo "Current leads.csv:"
          if [ -f data/leads.csv ]; then
            cat data/leads.csv
          else
            echo "data/leads.csv not found."
          fi
