# ============================================================
# CSV
# ============================================================

def ensure_csv() -> None:
    DATA_DIR.mkdir(
        parents=True,
        exist_ok=True
    )

    if (
        not DATA_FILE.exists()
        or DATA_FILE.stat().st_size == 0
    ):
        with DATA_FILE.open(
            "w",
            newline="",
            encoding="utf-8"
        ) as file:
            writer = csv.DictWriter(
                file,
                fieldnames=CSV_HEADERS
            )

            writer.writeheader()


def read_csv() -> List[Dict[str, str]]:
    ensure_csv()

    with DATA_FILE.open(
        "r",
        newline="",
        encoding="utf-8"
    ) as file:
        reader = csv.DictReader(file)

        rows = []

        for row in reader:
            rows.append({
                header: clean(
                    row.get(header, "")
                )
                for header in CSV_HEADERS
            })

        return rows


def normalize_lead(
    lead: Dict[str, Any]
) -> Dict[str, str]:

    row = {}

    for header in CSV_HEADERS:
        row[header] = clean(
            lead.get(header, "")
        )

    for field in [
        "profile_url",
        "channel_url",
        "instagram",
        "linkedin",
        "twitter_x",
        "website",
    ]:
        row[field] = normalize_url(
            row[field]
        )

    return row


def get_lead_key(
    lead: Dict[str, Any]
) -> str:

    platform = clean(
        lead.get("platform", "")
    ).lower()

    profile = normalize_url(
        lead.get("profile_url", "")
    ).lower()

    channel = normalize_url(
        lead.get("channel_url", "")
    ).lower()

    name = clean(
        lead.get("name", "")
    ).lower()

    if profile:
        return f"{platform}|{profile}"

    if channel:
        return f"{platform}|{channel}"

    return f"{platform}|{name}"


def save_csv(
    leads: List[Dict[str, Any]]
) -> int:

    ensure_csv()

    existing = read_csv()

    existing_keys = {
        get_lead_key(row)
        for row in existing
    }

    new_rows = []

    for lead in leads:

        row = normalize_lead(lead)

        key = get_lead_key(row)

        if key in existing_keys:
            continue

        existing_keys.add(key)

        new_rows.append(row)

    if not new_rows:
        return 0

    with DATA_FILE.open(
        "a",
        newline="",
        encoding="utf-8"
    ) as file:

        writer = csv.DictWriter(
            file,
            fieldnames=CSV_HEADERS
        )

        for row in new_rows:
            writer.writerow(row)

    return len(new_rows)


