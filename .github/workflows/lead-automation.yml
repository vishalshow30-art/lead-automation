# ============================================================
# FILE HELPERS
# ============================================================

def ensure_leads_file() -> None:
    """
    Create data/leads.csv with the correct headers if it
    does not already exist.
    """
    DATA_DIR.mkdir(parents=True, exist_ok=True)

    if not DATA_FILE.exists():
        with DATA_FILE.open(
            "w",
            newline="",
            encoding="utf-8",
        ) as file:
            writer = csv.DictWriter(
                file,
                fieldnames=CSV_HEADERS,
            )
            writer.writeheader()

        print(f"Created: {DATA_FILE}")


def load_existing_leads() -> List[Dict[str, str]]:
    """
    Load existing leads so duplicates are not added.
    """
    ensure_leads_file()

    leads = []

    try:
        with DATA_FILE.open(
            "r",
            newline="",
            encoding="utf-8",
        ) as file:
            reader = csv.DictReader(file)

            for row in reader:
                leads.append({
                    header: (row.get(header) or "").strip()
                    for header in CSV_HEADERS
                })

    except Exception as exc:
        print(f"Could not read existing leads: {exc}")

    return leads


def save_leads(leads: List[Dict[str, str]]) -> None:
    """
    Save all leads back to CSV.
    """
    DATA_DIR.mkdir(parents=True, exist_ok=True)

    with DATA_FILE.open(
        "w",
        newline="",
        encoding="utf-8",
    ) as file:
        writer = csv.DictWriter(
            file,
            fieldnames=CSV_HEADERS,
        )

        writer.writeheader()

        for lead in leads:
            writer.writerow({
                header: lead.get(header, "")
                for header in CSV_HEADERS
            })


# ============================================================
# DUPLICATE PROTECTION
# ============================================================

def normalize_url(url: str) -> str:
    return url.strip().lower().rstrip("/")


def lead_exists(
    existing_leads: List[Dict[str, str]],
    channel_url: str,
    name: str,
) -> bool:

    normalized_url = normalize_url(channel_url)
    normalized_name = name.strip().lower()

    for lead in existing_leads:

        old_url = normalize_url(
            lead.get("channel_url", "")
        )

        old_name = lead.get(
            "name",
            "",
        ).strip().lower()

        if normalized_url and old_url == normalized_url:
            return True

        if normalized_name and old_name == normalized_name:
            return True

    return False


# ============================================================
# DATA CLEANING
# ============================================================

def clean_text(value: str) -> str:
    if not value:
        return ""

    value = value.replace("\n", " ")
    value = re.sub(r"\s+", " ", value)

    return value.strip()


def detect_niche(title: str, description: str) -> str:
    """
    Try to identify a niche from public channel information.
    """
    text = (
        f"{title} {description}"
    ).lower()

    for niche in NICHES:

        keywords = niche.lower().split()

        if any(
            keyword in text
            for keyword in keywords
            if len(keyword) > 3
        ):
            return niche

    return ""


def detect_country(title: str, description: str) -> str:
    """
    Basic country detection from public channel text.
    This is intentionally conservative.
    """
    text = (
        f"{title} {description}"
    ).lower()

    india_terms = [
        "india",
        "indian",
        "hindi",
        "bharat",
        "delhi",
        "mumbai",
        "bangalore",
        "bengaluru",
        "hyderabad",
        "pune",
    ]

    if any(
        term in text
        for term in india_terms
    ):
        return "India"

    return ""


# ============================================================
# YOUTUBE
# ============================================================

def get_youtube_service():
    """
    Create a YouTube API client using YOUTUBE_API_KEY.
    """
    api_key = os.getenv("YOUTUBE_API_KEY")

    if not api_key:
        print(
            "YOUTUBE_API_KEY not found. "
            "Skipping YouTube collection."
        )
        return None

    if build is None:
        print(
            "google-api-python-client is not installed. "
            "Skipping YouTube collection."
        )
        return None

    return build(
        "youtube",
        "v3",
        developerKey=api_key,
    )


def search_youtube_channels(
    youtube,
    search_term: str,
    max_results: int = 25,
) -> List[Dict[str, str]]:

    results = []

    try:
        response = youtube.search().list(
            part="snippet",
            q=search_term,
            type="channel",
            maxResults=max_results,
        ).execute()

    except Exception as exc:
        print(
            f"YouTube search failed for "
            f"'{search_term}': {exc}"
        )
        return results

    for item in response.get("items", []):

        channel_id = (
            item.get("id", {})
            .get("channelId", "")
        )

        snippet = item.get(
            "snippet",
            {},
        )

        title = clean_text(
            snippet.get("title", "")
        )

        description = clean_text(
            snippet.get("description", "")
        )

        if not channel_id or not title:
            continue

        results.append({
            "channel_id": channel_id,
            "name": title,
            "description": description,
            "channel_url": (
                "https://www.youtube.com/channel/"
                + channel_id
            ),
        })

    return results


def get_youtube_channel_details(
    youtube,
    channel_ids: List[str],
) -> List[Dict[str, str]]:

    if not channel_ids:
        return []

    details = []

    # YouTube API accepts up to 50 IDs per request.
    for start in range(
        0,
        len(channel_ids),
        50,
    ):

        batch = channel_ids[
            start:start + 50
        ]

        try:
            response = youtube.channels().list(
                part="snippet,statistics",
                id=",".join(batch),
            ).execute()

        except Exception as exc:
            print(
                f"YouTube channel details failed: {exc}"
            )
            continue

        for item in response.get(
            "items",
            [],
        ):

            snippet = item.get(
                "snippet",
                {},
            )

            statistics = item.get(
                "statistics",
                {},
            )

            title = clean_text(
                snippet.get("title", "")
            )

            description = clean_text(
                snippet.get("description", "")
            )

            channel_id = item.get(
                "id",
                "",
            )

            subscribers = statistics.get(
                "subscriberCount",
                "",
            )

            hidden_subscribers = statistics.get(
                "hiddenSubscriberCount",
                False,
            )

            if hidden_subscribers:
                subscribers = ""

            details.append({
                "name": title,
                "platform": "YouTube",
                "channel_url": (
                    "https://www.youtube.com/channel/"
                    + channel_id
                ),
                "subscriber_count": subscribers,
                "niche": detect_niche(
                    title,
                    description,
                ),
                "country": (
                    clean_text(
                        snippet.get(
                            "country",
                            "",
                        )
                    )
                    or detect_country(
                        title,
                        description,
                    )
                ),
                "contact_email": "",
                "business_email": "",
                "website": clean_text(
                    snippet.get(
                        "customUrl",
                        "",
                    )
                ),
                "instagram_url": "",
                "notes": (
                    "Collected from public "
                    "YouTube channel information."
                ),
            })

    return details


# ============================================================
# LEAD FILTERING
# ============================================================

def subscriber_in_target_range(
    subscriber_count: str,
) -> bool:

    if not subscriber_count:
        return False

    try:
        count = int(subscriber_count)

    except ValueError:
        return False

    return 10_000 <= count <= 50_000


def is_relevant_lead(
    lead: Dict[str, str],
) -> bool:

    platform = lead.get(
        "platform",
        "",
    )

    if platform == "YouTube":

        # Keep the user's target creator range.
        return subscriber_in_target_range(
            lead.get(
                "subscriber_count",
                "",
            )
        )

    return True


