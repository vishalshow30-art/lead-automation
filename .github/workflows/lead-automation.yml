def youtube_search(
    query: str,
    pages: int = 2
) -> List[str]:

    channel_ids = []
    page_token = ""

    for _ in range(pages):

        params = {
            "part": "snippet",
            "q": query,
            "type": "channel",
            "maxResults": 50,
        }

        if page_token:
            params["pageToken"] = page_token

        data = youtube_request(
            "search",
            params
        )

        for item in data.get(
            "items",
            []
        ):
            channel_id = (
                item
                .get("snippet", {})
                .get("channelId", "")
            )

            if channel_id:
                channel_ids.append(
                    channel_id
                )

        page_token = data.get(
            "nextPageToken",
            ""
        )

        if not page_token:
            break

        time.sleep(
            REQUEST_DELAY
        )

    return list(
        dict.fromkeys(channel_ids)
    )


def youtube_channels(
    channel_ids: List[str]
) -> List[Dict[str, Any]]:

    results = []

    for start in range(
        0,
        len(channel_ids),
        50
    ):

        batch = channel_ids[
            start:start + 50
        ]

        data = youtube_request(
            "channels",
            {
                "part": (
                    "snippet,"
                    "statistics,"
                    "brandingSettings"
                ),
                "id": ",".join(batch),
                "maxResults": 50,
            }
        )

        results.extend(
            data.get(
                "items",
                []
            )
        )

        time.sleep(
            REQUEST_DELAY
        )

    return results


def youtube_latest_upload(
    channel_id: str
) -> str:

    data = youtube_request(
        "search",
        {
            "part": "snippet",
            "channelId": channel_id,
            "type": "video",
            "order": "date",
            "maxResults": 1,
        }
    )

    items = data.get(
        "items",
        []
    )

    if not items:
        return ""

    return clean(
        items[0]
        .get("snippet", {})
        .get("publishedAt", "")
    )


def make_youtube_lead(
    channel: Dict[str, Any]
) -> Dict[str, Any]:

    snippet = channel.get(
        "snippet",
        {}
    )

    statistics = channel.get(
        "statistics",
        {}
    )

    branding = channel.get(
        "brandingSettings",
        {}
    )

    channel_id = clean(
        channel.get("id", "")
    )

    name = clean(
        snippet.get("title", "")
    )

    description = clean(
        snippet.get("description", "")
    )

    country_code = clean(
        snippet.get("country", "")
    )

    subscribers = safe_int(
        statistics.get(
            "subscriberCount",
            0
        )
    )

    video_count = safe_int(
        statistics.get(
            "videoCount",
            0
        )
    )

    profile_url = (
        f"https://www.youtube.com/channel/"
        f"{channel_id}"
    )

    custom_url = clean(
        snippet.get(
            "customUrl",
            ""
        )
    )

    if custom_url:
        profile_url = (
            "https://www.youtube.com/"
            + custom_url.lstrip("@")
        )

    combined_text = (
        f"{name} {description}"
    )

    niche = detect_niche(
        combined_text
    )

    is_india = (
        country_code.upper() == "IN"
        or "india" in combined_text.lower()
        or "indian" in combined_text.lower()
    )

    country = (
        "India"
        if is_india
        else country_code
    )

    email = extract_email(
        description
    )

    keywords = (
        branding
        .get("channel", {})
        .get("keywords", "")
    )

    recent_upload = (
        youtube_latest_upload(
            channel_id
        )
    )

    return {
        "name": name,
        "platform": "YouTube",
        "profile_url": profile_url,
        "channel_url": profile_url,
        "creator_or_business": "Creator",
        "niche": niche,
        "country": country,
        "city": "",
        "subscribers": str(subscribers),
        "avg_views": "",
        "business_email": email,
        "instagram": "",
        "linkedin": "",
        "twitter_x": "",
        "website": "",
        "recent_upload": recent_upload,
        "contact_type": (
            "Business email"
            if email
            else "Public profile"
        ),
        "lead_source": "YouTube Data API",
        "status": "New",
        "notes": (
            f"Public YouTube channel. "
            f"Video count: {video_count}. "
            f"Keywords: {clean(keywords)}"
        ),
    }


def collect_youtube() -> List[Dict[str, Any]]:

    if not YOUTUBE_API_KEY:
        print(
            "YouTube: API key missing."
        )
        return []

    print(
        "YouTube: collecting channels..."
    )

    channel_ids = []

    for query in youtube_queries():

        print(
            f"YouTube search: {query}"
        )

        channel_ids.extend(
            youtube_search(
                query,
                pages=2
            )
        )

    channel_ids = list(
        dict.fromkeys(channel_ids)
    )

    print(
        f"YouTube channels found: "
        f"{len(channel_ids)}"
    )

    channels = youtube_channels(
        channel_ids
    )

    leads = []

    for channel in channels:

        subscribers = safe_int(
            channel
            .get("statistics", {})
            .get(
                "subscriberCount",
                0
            )
        )

        if not (
            MIN_SUBSCRIBERS
            <= subscribers
            <= MAX_SUBSCRIBERS
        ):
            continue

        leads.append(
            make_youtube_lead(
                channel
            )
        )

    print(
        f"YouTube qualifying leads: "
        f"{len(leads)}"
    )

    return leads


