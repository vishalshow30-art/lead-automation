name: lead-automation

on:
  workflow_dispatch:

jobs:
  lead-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "ERROR: GOOGLE_SHEET_ID is missing."
            exit 1
          fi

          echo "YouTube API key is available."
          echo "Google service account secret is available."
          echo "Google Sheet ID is available."

      - name: Run lead collector for 5 hours
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          END_TIME=$(( $(date +%s) + 17400 ))

          while [ $(date +%s) -lt $END_TIME ]; do
            echo "=========================================="
            echo "Starting lead collection cycle..."
            echo "=========================================="

            python src/lead_collector.py

            echo "Cycle completed."

            if [ $(date +%s) -lt $END_TIME ]; then
              echo "Waiting 30 minutes before next cycle..."
              sleep 1800
            fi
          done

          echo "=========================================="
          echo "5-hour lead collection completed."
          echo "=========================================="
