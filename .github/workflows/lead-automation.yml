name: Lead Automation

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "How long should the automation run?"
        required: true
        default: "1"
        type: string

jobs:
  lead-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show automation settings
        run: |
          echo "Lead Automation Started"
          echo "Duration: ${{ inputs.duration_minutes }} minutes"

      - name: Prepare workspace
        run: |
          mkdir -p data
          echo "Workspace ready."

      - name: Run Lead Collector
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python src/lead_collector.py

      - name: Show leads database
        run: |
          echo "Current leads.csv:"
          cat data/leads.csv

      - name: Finish
        run: |
          echo "Lead Automation completed."
