name: lead-automation

on:
  workflow_dispatch:

jobs:
  lead-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # =====================================================
      # CHECK REQUIRED SECRETS
      # =====================================================

      - name: Check required secrets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

        run: |
          echo "Checking required secrets..."

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "ERROR: YOUTUBE_API_KEY is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "ERROR: GOOGLE_SHEET_ID is missing."
            exit 1
          fi

          echo "YouTube API key is available."
          echo "Google service account secret is available."
          echo "Google Sheet ID is available."


      # =====================================================
      # RUN LEAD COLLECTOR
      # =====================================================

      - name: Run lead collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}

          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}

          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

          X_API_KEY: ${{ secrets.X_API_KEY }}

          X_API_SECRET: ${{ secrets.X_API_SECRET }}

        run: |
          python src/lead_collector.py


      # =====================================================
      # CHECK CSV
      # =====================================================

      - name: Check leads.csv
        run: |
          echo "Checking leads.csv..."

          if [ -f data/leads.csv ]; then
            echo "leads.csv created successfully."

            echo "Number of lines:"
            wc -l data/leads.csv

            echo "CSV preview:"
            head -10 data/leads.csv

          else
            echo "ERROR: data/leads.csv was not created."
            exit 1
          fi


      # =====================================================
      # UPLOAD CSV AS ARTIFACT
      # =====================================================

      - name: Upload collected leads
        uses: actions/upload-artifact@v4
        with:
          name: collected-leads
          path: data/leads.csv
