name: lead-automation

on:
  workflow_dispatch:

jobs:
  lead-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Create required directories
        run: |
          mkdir -p data
          mkdir -p logs

      - name: Run Lead Collector
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
        run: |
          python src/lead_collector.py

      - name: Check generated leads
        run: |
          echo "Checking leads.csv..."
          if [ -f data/leads.csv ]; then
            echo "leads.csv created successfully."
            echo "Number of lines:"
            wc -l data/leads.csv
          else
            echo "ERROR: data/leads.csv was not created."
            exit 1
          fi

      - name: Upload leads.csv as artifact
        uses: actions/upload-artifact@v4
        with:
          name: collected-leads
          path: data/leads.csv
