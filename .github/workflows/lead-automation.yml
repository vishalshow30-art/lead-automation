# ============================================================
# HELPERS
# ============================================================

def clean(value: Any) -> str:
    if value is None:
        return ""

    return re.sub(
        r"\s+",
        " ",
        str(value)
    ).strip()


def normalize_url(url: Any) -> str:
    url = clean(url)

    if not url:
        return ""

    if not url.startswith(
        ("http://", "https://")
    ):
        return "https://" + url

    return url


def safe_int(value: Any) -> int:
    try:
        return int(value)
    except (TypeError, ValueError):
        return 0


def extract_email(text: str) -> str:
    text = clean(text)

    if not text:
        return ""

    matches = re.findall(
        r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}",
        text,
        flags=re.IGNORECASE,
    )

    return (
        matches[0].lower()
        if matches
        else ""
    )


