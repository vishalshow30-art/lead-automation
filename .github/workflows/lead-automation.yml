
name: lead-automation

on:
  workflow_dispatch:
  # Uncomment these lines only if you want an automatic run every 5 minutes.
  # schedule:
  #   - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: lead-automation
  cancel-in-progress: false

jobs:
  lead-automation:
    name: Collect and save leads
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
      GOOGLE_SHEET_WORKSHEET: "Sheet1"

      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}

      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}

      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Check required secrets
        shell: bash
        run: |
          set -e

          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::YOUTUBE_API_KEY is missing."
          else
            echo "YouTube API key is configured."
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is missing."
            exit 1
          fi

          if [ -z "$GOOGLE_SHEET_ID" ]; then
            echo "::error::GOOGLE_SHEET_ID is missing."
            exit 1
          fi

          if [ -z "$X_BEARER_TOKEN" ]; then
            echo "::warning::X_BEARER_TOKEN is missing; X collection will be skipped."
          else
            echo "X Bearer Token is configured."
          fi

          echo "Required Google Sheets secrets are configured."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile src/lead_collector.py

      - name: Run lead collector
        run: |
          python src/lead_collector.py

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-automation-csv
          path: data/leads.csv
          if-no-files-found: warn
          retention-days: 7
